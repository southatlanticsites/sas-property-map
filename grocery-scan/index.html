<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1A33;--navy2:#132040;--navy3:#1A2A4E;--gold:#C9A249;--cream:#F6F1E9;--mid:#8A95A5;--border:rgba(255,255,255,.09);
  --short:#2BD1A0;--second:#F5B83D;--out:#9AA3AE;--store:#EF4444;--box:#FF8A00;
}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--navy);color:var(--cream)}
#app{display:flex;height:100%}
#sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--navy);box-shadow:4px 0 24px rgba(0,0,0,.35);z-index:2}
#sb-head{padding:18px 20px 14px;background:var(--navy2);border-bottom:1px solid var(--border)}
.firm{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;line-height:1.1;margin:4px 0 4px}
.sub{font-size:12px;color:var(--mid);line-height:1.4}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.ctrl .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);width:44px}
button.chip{font:600 12px/1 'DM Sans',sans-serif;color:var(--cream);background:var(--navy3);border:1px solid var(--border);border-radius:999px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.chip[aria-pressed="false"]{opacity:.45}
button.chip:hover{border-color:var(--gold)}
button.chip:focus-visible,.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-short{background:var(--short)}.d-second{background:var(--second)}.d-out{background:transparent;border:2px solid var(--out)}.d-store{background:var(--store)}.d-box{background:var(--box);border-radius:2px}
#list{flex:1;overflow:auto;padding-bottom:20px}
.mk h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:16px 20px 6px}
.mk .none{margin:0 20px 6px;color:var(--mid);font-size:12.5px}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;align-items:baseline;padding:8px 20px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:rgba(255,255,255,.04)}
.item.sel{background:rgba(201,162,73,.10);border-left-color:var(--gold)}
.item .nm{font-weight:600;font-size:14px}
.item .ds{font-size:12.5px;color:var(--mid);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .meta{grid-column:2/4;font-size:12.5px;color:var(--mid);line-height:1.4}
.item.out .nm{text-decoration:line-through;text-decoration-color:var(--out);color:#C9CED6}
[hidden]{display:none!important}
.note{margin:18px 20px 0;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--mid);line-height:1.5}
.note p{margin-bottom:6px}
#map{flex:1;min-height:300px}
/* info window */
.iw{font-family:'DM Sans',sans-serif;color:#0B1A33;max-width:280px}
.iw .tier{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.iw h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.15;margin:3px 0 6px}
.iw dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin-bottom:8px}
.iw dt{color:#5b6576}.iw dd{font-variant-numeric:tabular-nums}
.iw p{font-size:12.5px;margin-bottom:8px;line-height:1.4}
.iw a{color:#0B5CAD;font-weight:600}
@media (max-width:820px){
  #app{flex-direction:column-reverse;height:auto}
  #map{height:62vh;flex:none}
  #sidebar{width:100%}
  #list{overflow:visible}
}
</style>
</head>

anch Rd"},{"n":"12295 Capital Blvd, Wake Forest","s":"open","c":[35.9817384,-78.5405872],"pid":"ChIJZ7u7b1BTrIkRy5h34WS7bzU","mk":"Wake Forest (not a target market)","near_mi":1.64,"near":"Wake Forest – 1120 S Main St"},{"n":"630 Lakestone Commons Ave, Fuquay-Varina","s":"open","c":[35.5928677,-78.7639023],"pid":"ChIJEX-ohDuPrIkRm7gQcLldFOk","mk":"Fuquay","near_mi":11.01,"near":"Apex – 670 Grand Central Station"},{"n":"1811 S Church St, Burlington","s":"open","c":[36.0845286,-79.4608852],"pid":"ChIJG1y8ydwrU4gRK4qRL2d8eo0","mk":"Burlington (near E Burlington/Graham)","near_mi":1.76,"near":"Burlington – 3010 S Church St"},{"n":"3718 Battleground Ave, Greensboro","s":"open","c":[36.1337064,-79.8539051],"pid":"ChIJo5nvLUocU4gRiXuYa4nxIn4","mk":"Greensboro (not a target market)","near_mi":1.72,"near":"Greensboro – 3005 Martinsville Rd"},{"n":"2531 Eastchester Dr, High Point","s":"open","c":[36.0300122,-79.9700897],"pid":"ChIJ943JjpsFU4gRpWXEqSPSwdw","mk":"High Point","near_mi":4.2,"near":"Greensboro – 5696 W Gate City Blvd"},{"n":"1677 Westchester Dr, High Point","s":"open","c":[35.949855,-80.0317298],"pid":"ChIJcZ01hPQJU4gRKtm4QpDSbDg","mk":"High Point","near_mi":8.9,"near":"Greensboro – 5696 W Gate City Blvd"},{"n":"100 Westwood Village Dr, Clemmons","s":"open","c":[36.0308829,-80.3839695],"pid":"ChIJBxSjp-u5U4gRq60Qz4q8EeM","mk":"Clemmons","near_mi":6.85,"near":"Winston-Salem – 3315 Sides Branch Rd"}];
const MI=1609.344, BUF=4.5;
const COL={short:'#2BD1A0',second:'#F5B83D',out:'#9AA3AE',store:'#EF4444',box:'#FF8A00'};
const TIER={short:'Shortlist',second:'Second tier',out:'Ruled out'};
function hav(a,b){const R=3958.8,r=x=>x*Math.PI/180;const dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
SITES.forEach(s=>{let b=null;STORES.forEach(l=>{const d=hav(s.c,l.c);if(!b||d<b.d)b={d,l};});s.near=b;});
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const ll=c=>({lat:c[0],lng:c[1]});

let map,iw,ring=null;const groups={short:[],second:[],out:[],store:[],box:[]};const shown={short:true,second:true,out:false,store:true,box:true};
const VIEWS={tri:[[35.68,-78.95],[36.02,-78.47]],triad:[[35.82,-80.45],[36.16,-79.30]],all:[[35.68,-80.45],[36.18,-78.47]]};
function fit(k){const v=VIEWS[k];map.fitBounds(new google.maps.LatLngBounds(ll(v[0]),ll(v[1])),20);}

function content(s){
  return '<div class="iw"><div class="tier" style="color:'+(s.t==='out'?'#6b7380':s.t==='second'?'#A36F00':'#0E7A5C')+'">'+TIER[s.t]+' · '+esc(MARKETS[s.m])+'</div><h3>'+esc(s.n)+'</h3>'+
  '<dl><dt>Type</dt><dd>'+esc(s.type)+'</dd><dt>Size</dt><dd>'+esc(s.size)+'</dd><dt>Ask</dt><dd>'+esc(s.ask)+'</dd><dt>Nearest store</dt><dd>'+s.near.d.toFixed(2)+' mi · '+esc(s.near.l.n)+'</dd></dl>'+
  (s.why?'<p><strong>Why out:</strong> '+esc(s.why)+'</p>':'')+(s.note?'<p>'+esc(s.note)+'</p>':'')+(s.approx?'<p style="color:#5b6576">Map point is approximate.</p>':'')+
  '<a href="'+s.u+'" target="_blank" rel="noopener">Open listing ↗</a></div>';
}
function select(i,fly){
  const s=SITES[i];
  if(ring)ring.setMap(null);
  ring=new google.maps.Circle({map,center:ll(s.c),radius:3*MI,strokeColor:'#FFFFFF',strokeOpacity:.9,strokeWeight:1.5,fillOpacity:0,clickable:false});
  document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));
  const el=document.getElementById('it'+i);if(el)el.classList.add('sel');
  if(!shown[s.t])toggle(s.t,true);
  iw.setContent(content(s));iw.open({map,anchor:s.marker});
  if(fly){map.fitBounds(ring.getBounds(),20);}
}
function boxContent(b){const ok=b.near_mi>=4.5;return '<div class="iw"><div class="tier" style="color:#C25E00">Box Watch · Big Lots · '+(b.s==='closed'?'Closed':'Open')+'</div><h3>'+esc(b.n)+'</h3><dl><dt>Market</dt><dd>'+esc(b.mk)+'</dd><dt>Nearest store</dt><dd>'+b.near_mi.toFixed(2)+' mi · '+esc(b.near)+'</dd><dt>4.5-mi rule</dt><dd>'+(ok?'Clears':'Inside 4.5 mi')+'</dd></dl><p>Typical Big Lots box is roughly 25–35K SF. Size, owner and leasing broker not yet confirmed.</p><a href="https://www.google.com/maps/place/?q=place_id:'+b.pid+'" target="_blank" rel="noopener">Open in Google Maps ↗</a></div>';}
function selectBox(i){const b=BOX[i];if(!shown.box)toggle('box',true);if(ring){ring.setMap(null);ring=null;}document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));const el=document.getElementById('bx'+i);if(el)el.classList.add('sel');ring=new google.maps.Circle({map,center:ll(b.c),radius:3*MI,strokeColor:'#FFFFFF',strokeOpacity:.9,strokeWeight:1.5,fillOpacity:0,clickable:false});iw.setContent(boxContent(b));iw.open({map,anchor:b.marker});map.fitBounds(ring.getBounds(),20);}
function setVis(k,on){shown[k]=on;groups[k].forEach(o=>o.setMap(on?map:null));document.querySelectorAll('.item[data-t="'+k+'"]').forEach(e=>e.hidden=!on);}
function toggle(k,force){const b=document.getElementById('t-'+k);const on=force!==undefined?force:b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);setVis(k,on);}

function buildList(){
  let h='';
  MARKETS.forEach((m,mi)=>{
    const list=SITES.map((s,i)=>[s,i]).filter(([s])=>s.m===mi).sort((a,b)=>['short','second','out'].indexOf(a[0].t)-['short','second','out'].indexOf(b[0].t));
    h+='<section class="mk"><h2>'+esc(m)+'</h2>';
    if(!list.some(([s])=>s.t!=='out'))h+='<p class="none">No qualifying listing on Crexi or LoopNet.</p>';
    list.forEach(([s,i])=>{h+='<div class="item '+s.t+'" id="it'+i+'" data-t="'+s.t+'" tabindex="0" role="button"><span class="dot d-'+s.t+'"></span><span class="nm">'+esc(s.n)+'</span><span class="ds">'+s.near.d.toFixed(1)+' mi</span><span class="meta">'+esc(s.type+' · '+s.size+' · '+s.ask)+(s.why?' · '+esc(s.why):'')+'</span></div>';});
    h+='</section>';
  });
  const bx=BOX.map((b,i)=>[b,i]).filter(([b])=>b.s==='closed').sort((a,b)=>(b[0].near_mi>=4.5)-(a[0].near_mi>=4.5));
  h+='<section class="mk"><h2>Box Watch · closed Big Lots</h2>';
  bx.forEach(([b,i])=>{const ok=b.near_mi>=4.5;h+='<div class="item box'+(ok?'':' out')+'" id="bx'+i+'" data-t="box" tabindex="0" role="button"><span class="dot d-box"></span><span class="nm">'+esc(b.n)+'</span><span class="ds">'+b.near_mi.toFixed(1)+' mi</span><span class="meta">'+esc(b.mk)+(ok?'':' · Inside 4.5 mi')+'</span></div>';});
  h+='</section>';
  h+='<div class="note"><p>Distances are straight-line to the nearest existing store. Sites under 4.5 mi are ruled out. Points come from US Census address geocoding (about ±0.2 mi), so anything from 4.3 to 4.8 mi needs a parcel-level check.</p><p>A grocer in the same center rules a site out; a separately owned grocer next door does not.</p></div>';
  const L=document.getElementById('list');L.innerHTML=h;
  L.querySelectorAll('.item').forEach(el=>{const i=+el.id.slice(2);const fn=el.id.startsWith('bx')?()=>selectBox(i):()=>select(i,true);el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}});if(false)el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i,true);}});});
}

window.initMap=function(){
  map=new google.maps.Map(document.getElementById('map'),{center:{lat:35.95,lng:-79.5},zoom:8,mapTypeId:'hybrid',mapTypeControl:true,mapTypeControlOptions:{mapTypeIds:['hybrid','satellite','roadmap','terrain'],position:google.maps.ControlPosition.TOP_RIGHT},streetViewControl:true,fullscreenControl:true});
  iw=new google.maps.InfoWindow();
  iw.addListener('closeclick',()=>{if(ring){ring.setMap(null);ring=null;}document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));});
  STORES.forEach(l=>{
    groups.store.push(new google.maps.Circle({map,center:ll(l.c),radius:BUF*MI,strokeColor:COL.store,strokeOpacity:.95,strokeWeight:1.5,fillColor:COL.store,fillOpacity:.10,clickable:false}));
    const m=new google.maps.Marker({map,position:ll(l.c),title:l.n,zIndex:5,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:COL.store,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
    m.addListener('click',()=>{iw.setContent('<div class="iw"><div class="tier" style="color:#B91C1C">Existing store</div><h3>'+esc(l.n)+'</h3><p>4.5-mi straight-line buffer shown.</p></div>');iw.open({map,anchor:m});});
    groups.store.push(m);
  });
  SITES.forEach((s,i)=>{
    const out=s.t==='out';
    const m=new google.maps.Marker({map:shown[s.t]?map:null,position:ll(s.c),title:s.n,zIndex:s.t==='short'?30:out?10:20,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:s.t==='short'?9:7,fillColor:out?'#000':COL[s.t],fillOpacity:out?.25:1,strokeColor:out?COL.out:'#0B1A33',strokeWeight:out?2.5:2}});
    m.addListener('click',()=>select(i,false));
    s.marker=m;groups[s.t].push(m);
  });
  BOX.forEach((b,i)=>{if(b.s!=='closed')return;const ok=b.near_mi>=4.5;const m=new google.maps.Marker({map,position:ll(b.c),title:'Big Lots – '+b.n,zIndex:25,icon:{path:'M -6 -6 L 6 -6 L 6 6 L -6 6 Z',scale:1.1,fillColor:COL.box,fillOpacity:ok?1:.35,strokeColor:'#0B1A33',strokeWeight:2}});m.addListener('click',()=>selectBox(i));b.marker=m;groups.box.push(m);});
  buildList();setVis('out',false);
  document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>toggle(b.dataset.k)));
  document.querySelectorAll('[data-z]').forEach(b=>b.addEventListener('click',()=>fit(b.dataset.z)));
  fit('all');
};
(function(){const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+API_KEY+'&callback=initMap';s.async=true;s.defer=true;document.head.appendChild(s);})();
</script>
