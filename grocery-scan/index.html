<title>Grocery Site Scan – South Atlantic Sites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1A33;--navy2:#132040;--navy3:#1A2A4E;--gold:#C9A249;--cream:#F6F1E9;--mid:#8A95A5;--border:rgba(255,255,255,.09);
  --short:#2BD1A0;--second:#F5B83D;--out:#9AA3AE;--store:#EF4444;--box:#FF8A00;
}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--navy);color:var(--cream)}
#app{display:flex;height:100%}
#sidebar{width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--navy);box-shadow:4px 0 24px rgba(0,0,0,.35);z-index:2}
#sb-head{padding:18px 20px 14px;background:var(--navy2);border-bottom:1px solid var(--border)}
.firm{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;line-height:1.1;margin:4px 0 4px}
.sub{font-size:12px;color:var(--mid);line-height:1.4}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.ctrl .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);width:44px}
button.chip{font:600 12px/1 'DM Sans',sans-serif;color:var(--cream);background:var(--navy3);border:1px solid var(--border);border-radius:999px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.chip[aria-pressed="false"]{opacity:.45}
button.chip:hover{border-color:var(--gold)}
button.chip:focus-visible,.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-short{background:var(--short)}.d-second{background:var(--second)}.d-out{background:transparent;border:2px solid var(--out)}.d-store{background:var(--store)}.d-box{background:var(--box);border-radius:2px}.d-groc{background:#4FA3FF}.d-big{background:#C7CCD4;border-radius:2px}.d-ctr{background:#B784F5;transform:rotate(45deg);border-radius:1px}
#list{flex:1;overflow:auto;padding-bottom:20px}
.mk h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:16px 20px 6px}
.mk .none{margin:0 20px 6px;color:var(--mid);font-size:12.5px}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;align-items:baseline;padding:8px 20px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:rgba(255,255,255,.04)}
.item.sel{background:rgba(201,162,73,.10);border-left-color:var(--gold)}
.item .nm{font-weight:600;font-size:14px}
.item .ds{font-size:12.5px;color:var(--mid);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .meta{grid-column:2/4;font-size:12.5px;color:var(--mid);line-height:1.4}
.item.out .nm{text-decoration:line-through;text-decoration-color:var(--out);color:#C9CED6}
[hidden]{display:none!important}
.note{margin:18px 20px 0;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--mid);line-height:1.5}
.note p{margin-bottom:6px}
#map{flex:1;min-height:300px}
/* info window */
.iw{font-family:'DM Sans',sans-serif;color:#0B1A33;max-width:280px}
.iw .tier{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.iw h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.15;margin:3px 0 6px}
.iw dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;margin-bottom:8px}
.iw dt{color:#5b6576}.iw dd{font-variant-numeric:tabular-nums}
.iw p{font-size:12.5px;margin-bottom:8px;line-height:1.4}
.iw a{color:#0B5CAD;font-weight:600}
@media (max-width:820px){
  #app{flex-direction:column-reverse;height:auto}
  #map{height:62vh;flex:none}
  #sidebar{width:100%}
  #list{overflow:visible}
}
</style>
</head>

function demoLegend(){const k=DEMO_KEYS.find(x=>shown[x]);const el=document.getElementById('dlegend');if(!k){el.hidden=true;return;}el.hidden=false;
  el.innerHTML=DLEG[k]+'<p><strong>Click anywhere on the map</strong> for the 3-mile ring at that exact spot.</p><p style="color:#8b93a1">US Census ACS 2020–2024 5-yr estimates, 2,394 block groups, area-weighted. A screen, not an underwrite.</p>';}
let BG=null,BGP=null;function loadBG(){if(BG||BGP)return;BGP=fetch('bgpts.json').then(r=>r.json()).then(j=>{BG=j;});}
const EDG=[0,10e3,15e3,20e3,25e3,30e3,35e3,40e3,45e3,50e3,60e3,75e3,100e3,125e3,150e3,200e3,250e3];
function ringStats(la,lo,R){R=R||3;let P=0,H=0;const bins=new Array(16).fill(0);
  for(const r of BG){const dy=(la-r[0])*69.0,dx=(lo-r[1])*69.172*Math.cos((la+r[0])/2*Math.PI/180),d=Math.sqrt(dx*dx+dy*dy);
    const rr=Math.sqrt(Math.max(r[2],1e-4)/Math.PI);if(d>=R+rr)continue;let w;
    if(d+rr<=R)w=1;else if(d+R<=rr)w=R*R/(rr*rr);else{const a1=Math.acos(Math.max(-1,Math.min(1,(d*d+rr*rr-R*R)/(2*d*rr)))),a2=Math.acos(Math.max(-1,Math.min(1,(d*d+R*R-rr*rr)/(2*d*R))));
      const A=rr*rr*a1+R*R*a2-0.5*Math.sqrt(Math.max(0,(-d+rr+R)*(d+rr-R)*(d-rr+R)*(d+rr+R)));w=Math.min(1,A/(Math.PI*rr*rr));}
    P+=w*r[3];H+=w*r[4];for(let i=0;i<16;i++)bins[i]+=w*r[5+i];}
  const t=bins.reduce((a,b)=>a+b,0);let cum=0,med=null;for(let i=0;i<16;i++){if(cum+bins[i]>=t/2){med=EDG[i]+(t/2-cum)/Math.max(bins[i],1e-9)*(EDG[i+1]-EDG[i]);break;}cum+=bins[i];}
  return {P,H,med};}
let qring=null;
async function queryAt(ev){if(!DEMO_KEYS.some(k=>shown[k]))return;if(!BG){loadBG();await BGP;}
  const la=ev.latLng.lat(),lo=ev.latLng.lng();const s3=ringStats(la,lo,3),s1=ringStats(la,lo,1),s5=ringStats(la,lo,5);
  if(qring)qring.setMap(null);qring=new google.maps.Circle({map,center:ev.latLng,radius:3*MI,strokeColor:'#FFFFFF',strokeOpacity:.95,strokeWeight:2,fillOpacity:0,clickable:false});
  let nb=null;STORES.forEach(l=>{const d=hav([la,lo],l.c);if(!nb||d<nb.d)nb={d,l};});
  const f=n=>Math.round(n).toLocaleString(),$=m=>m==null?'n/a':m>=250e3?'$250K+':'$'+(m/1000).toFixed(1)+'K',ok=b=>b?'<span style="color:#0E7A5C">✓</span>':'<span style="color:#B42318">✗</span>';
  iw.setContent('<div class="iw"><div class="tier" style="color:#445">Ring at this spot</div><h3>'+la.toFixed(5)+', '+lo.toFixed(5)+'</h3><dl>'+
   '<dt>3-mi population</dt><dd>'+f(s3.P)+' '+ok(s3.P>=40000)+'</dd><dt>3-mi median HH income</dt><dd>'+$(s3.med)+' '+ok(s3.med>=50000)+'</dd><dt>3-mi households</dt><dd>'+f(s3.H)+'</dd>'+
   '<dt>1 mi / 5 mi pop</dt><dd>'+f(s1.P)+' / '+f(s5.P)+'</dd><dt>Nearest store</dt><dd>'+nb.d.toFixed(2)+' mi'+(nb.d<4.5?' <span style="color:#B42318">(inside 4.5)</span>':'')+'</dd></dl>'+
   '<p style="color:#5b6576">Census ACS 2020–24, block groups area-weighted.</p></div>');
  iw.setPosition(ev.latLng);iw.open({map});}


function buildList(){
  let h='';
  MARKETS.forEach((m,mi)=>{
    const list=SITES.map((s,i)=>[s,i]).filter(([s])=>s.m===mi).sort((a,b)=>['short','second','out'].indexOf(a[0].t)-['short','second','out'].indexOf(b[0].t));
    h+='<section class="mk"><h2>'+esc(m)+'</h2>';
    if(!list.some(([s])=>s.t!=='out'))h+='<p class="none">No qualifying listing on Crexi or LoopNet.</p>';
    list.forEach(([s,i])=>{h+='<div class="item '+s.t+'" id="it'+i+'" data-t="'+s.t+'" tabindex="0" role="button"><span class="dot d-'+s.t+'"></span><span class="nm">'+esc(s.n)+'</span><span class="ds">'+s.near.d.toFixed(1)+' mi</span><span class="meta">'+esc(s.type+' · '+s.size+' · '+s.ask)+(s.why?' · '+esc(s.why):'')+'</span></div>';});
    h+='</section>';
  });
  const bx=BOX.map((b,i)=>[b,i]).filter(([b])=>b.s==='closed').sort((a,b)=>(b[0].near_mi>=4.5)-(a[0].near_mi>=4.5));
  h+='<section class="mk"><h2>Box Watch · closed boxes</h2>';
  bx.forEach(([b,i])=>{const ok=b.near_mi>=4.5;h+='<div class="item box'+(ok?'':' out')+'" id="bx'+i+'" data-t="box" tabindex="0" role="button"><span class="dot d-box"></span><span class="nm">'+esc(b.n)+'</span><span class="ds">'+b.near_mi.toFixed(1)+' mi</span><span class="meta">'+esc(b.mk)+(ok?'':' · Inside 4.5 mi')+'</span></div>';});
  h+='</section>';
  h+='<div class="note"><p>Distances are straight-line to the nearest existing store. Sites under 4.5 mi are ruled out. Points come from US Census address geocoding (about ±0.2 mi), so anything from 4.3 to 4.8 mi needs a parcel-level check.</p><p>Grocer colors: blue conventional, pink Aldi, yellow Walmart/Target, green specialty, orange ethnic/value, light blue clubs. Grocers, big boxes and centers come from Google Places (Sep 28, 2026); each is tagged with any target market within 3 mi.</p><p>A grocer in the same center rules a site out; a separately owned grocer next door does not.</p></div>';
  const L=document.getElementById('list');L.innerHTML=h;
  L.querySelectorAll('.item').forEach(el=>{const i=+el.id.slice(2);const fn=el.id.startsWith('bx')?()=>selectBox(i):()=>select(i,true);el.addEventListener('click',fn);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}});if(false)el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i,true);}});});
}

window.initMap=function(){
  map=new google.maps.Map(document.getElementById('map'),{center:{lat:35.95,lng:-79.5},zoom:8,mapTypeId:'hybrid',mapTypeControl:true,mapTypeControlOptions:{mapTypeIds:['hybrid','satellite','roadmap','terrain'],position:google.maps.ControlPosition.TOP_RIGHT},streetViewControl:true,fullscreenControl:true});
  iw=new google.maps.InfoWindow();
  iw.addListener('closeclick',()=>{if(ring){ring.setMap(null);ring=null;}document.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));});
  STORES.forEach(l=>{
    groups.store.push(new google.maps.Circle({map,center:ll(l.c),radius:BUF*MI,strokeColor:COL.store,strokeOpacity:.95,strokeWeight:1.5,fillColor:COL.store,fillOpacity:.10,clickable:false}));
    const m=new google.maps.Marker({map,position:ll(l.c),title:l.n,zIndex:5,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:COL.store,fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
    m.addListener('click',()=>{iw.setContent('<div class="iw"><div class="tier" style="color:#B91C1C">Existing store</div><h3>'+esc(l.n)+'</h3><p>4.5-mi straight-line buffer shown.</p></div>');iw.open({map,anchor:m});});
    groups.store.push(m);
  });
  SITES.forEach((s,i)=>{
    const out=s.t==='out';
    const m=new google.maps.Marker({map:shown[s.t]?map:null,position:ll(s.c),title:s.n,zIndex:s.t==='short'?30:out?10:20,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:s.t==='short'?9:7,fillColor:out?'#000':COL[s.t],fillOpacity:out?.25:1,strokeColor:out?COL.out:'#0B1A33',strokeWeight:out?2.5:2}});
    m.addListener('click',()=>select(i,false));
    s.marker=m;groups[s.t].push(m);
  });
  BOX.forEach((b,i)=>{if(b.s!=='closed')return;const ok=b.near_mi>=4.5;const m=new google.maps.Marker({map,position:ll(b.c),title:b.brand+' – '+b.n,zIndex:25,icon:{path:'M -6 -6 L 6 -6 L 6 6 L -6 6 Z',scale:1.1,fillColor:COL.box,fillOpacity:ok?1:.35,strokeColor:'#0B1A33',strokeWeight:2}});m.addListener('click',()=>selectBox(i));b.marker=m;groups.box.push(m);});
  const GC={'Conventional':'#4FA3FF','Hard discount':'#FF5CA8','Walmart / Target':'#FFD23F','Specialty / natural':'#7CE38B','Ethnic / value':'#FF9E5E','Club':'#A0E7FF'};
  const dot=(c,sc)=>({path:google.maps.SymbolPath.CIRCLE,scale:sc,fillColor:c,fillOpacity:1,strokeColor:'#0B1A33',strokeWeight:1});
  function lp(title,kind,rows,extra){return '<div class="iw"><div class="tier" style="color:#445">'+kind+'</div><h3>'+esc(title)+'</h3><dl>'+rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>').join('')+'</dl>'+(extra||'')+'</div>';}
  const mkts=x=>x.markets&&x.markets.length?x.markets.join(', '):'Outside target markets';
  LAYERS.grocers.forEach(g=>{const m=new google.maps.Marker({map:null,position:ll([g.lat,g.lng]),title:g.brand,zIndex:12,icon:dot(GC[g.group]||'#4FA3FF',5)});
    m.addListener('click',()=>{iw.setContent(lp(g.brand,'Grocer · '+g.group,[['Address',g.addr],['Market',mkts(g)],['Nearest store',g.near_mi.toFixed(2)+' mi']]));iw.open({map,anchor:m});});groups.groc.push(m);});
  LAYERS.boxes.forEach(g=>{const m=new google.maps.Marker({map:null,position:ll([g.lat,g.lng]),title:g.brand,zIndex:11,icon:{path:'M -4 -4 L 4 -4 L 4 4 L -4 4 Z',scale:1,fillColor:'#C7CCD4',fillOpacity:1,strokeColor:'#0B1A33',strokeWeight:1}});
    m.addListener('click',()=>{iw.setContent(lp(g.brand,'Big box · open',[['Address',g.addr],['Market',mkts(g)]]));iw.open({map,anchor:m});});groups.big.push(m);});
  LAYERS.centers.forEach(c=>{const m=new google.maps.Marker({map:null,position:ll([c.lat,c.lng]),title:c.name,zIndex:10,icon:{path:'M 0 -6 L 6 0 L 0 6 L -6 0 Z',scale:1,fillColor:'#B784F5',fillOpacity:(c.grocers.length||c.boxes.length||c.dark.length)?1:.45,strokeColor:'#0B1A33',strokeWeight:1}});
    m.addListener('click',()=>{iw.setContent(lp(c.name,'Shopping center',[['Address',c.addr],['Market',mkts(c)],['Grocers',c.grocers.join(', ')||'None found'],['Big boxes',c.boxes.join(', ')||'None found'],['Dark boxes',c.dark.join(', ')||'None'],['Nearest store',c.near_mi.toFixed(2)+' mi']],'<p style="color:#5b6576">Anchors matched by distance (within ~0.2 mi); confirm on site.</p>'));iw.open({map,anchor:m});});groups.ctr.push(m);});
  // closed store (no spacing buffer)
  CADE.closed.forEach(c=>{const m=new google.maps.Marker({map,position:ll([c.lat,c.lng]),title:'Closed store location',zIndex:6,
     icon:{path:'M -5 -5 L 5 5 M 5 -5 L -5 5',scale:1.2,strokeColor:'#FFFFFF',strokeWeight:3.5}});
   const m2=new google.maps.Marker({map,position:ll([c.lat,c.lng]),clickable:false,zIndex:5,icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#6B7280',fillOpacity:1,strokeColor:'#fff',strokeWeight:1.5}});
   m.addListener('click',()=>{iw.setContent('<div class="iw"><div class="tier" style="color:#6B7280">Closed store location</div><h3>'+esc(c.addr)+'</h3><p>Former store, now closed. No 4.5-mi buffer applies.</p></div>');iw.open({map,anchor:m});});
   groups.store.push(m2,m);});
  // Cade's markets: CoStar traffic counts + market base points
  CADE.counts.forEach(c=>{const m=new google.maps.Marker({map:null,position:ll([c.lat,c.lng]),title:c.road+' – '+c.vpd.toLocaleString()+' VPD',zIndex:14,
     label:{text:Math.round(c.vpd/1000)+'K',color:'#0B1A33',fontSize:'10px',fontWeight:'700'},
     icon:{path:'M -11 -7 L 11 -7 L 11 7 L -11 7 Z',scale:1,fillColor:'#FBC02D',fillOpacity:1,strokeColor:'#0B1A33',strokeWeight:1}});
   m.addListener('click',()=>{iw.setContent('<div class="iw"><div class="tier" style="color:#8A6A00">Traffic count · CoStar</div><h3>'+c.vpd.toLocaleString()+' VPD</h3><dl><dt>Location</dt><dd>'+esc(c.road)+'</dd><dt>Market</dt><dd>Cade – '+esc(c.market)+'</dd></dl><p style="color:#5b6576">From Cade Bushee\'s market maps (CoStar). Compare with NCDOT counts in each site\'s RFP check.</p></div>');iw.open({map,anchor:m});});
   groups.cade.push(m);});
  CADE.bases.forEach(b=>{const m=new google.maps.Marker({map:null,position:ll([b.lat,b.lng]),title:'Cade – '+b.market+' (market center)',zIndex:13,icon:{path:google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,scale:5,fillColor:'#FBC02D',fillOpacity:1,strokeColor:'#0B1A33',strokeWeight:1.5}});
   m.addListener('click',()=>{iw.setContent('<div class="iw"><div class="tier" style="color:#8A6A00">Cade – '+esc(b.market)+'</div><h3>'+esc(b.name)+'</h3><p>Market center point used for the 3-mi ring.</p></div>');iw.open({map,anchor:m});});
   groups.cade.push(m);});
  const ob=new google.maps.LatLngBounds({lat:DEMO_B.S,lng:DEMO_B.W},{lat:DEMO_B.N,lng:DEMO_B.E});
  [['drfp','demo-rfp-web.png',1],['dpop','demo-pop-web.png',1],['dinc','demo-inc-web.png',0.9]].forEach(([k,u,o])=>groups[k].push(new google.maps.GroundOverlay(u,ob,{opacity:o,clickable:false})));
  map.addListener('click',queryAt);
  iw.addListener('closeclick',()=>{if(qring){qring.setMap(null);qring=null;}});
  buildList();setVis('out',false);
  document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>toggle(b.dataset.k)));
  document.querySelectorAll('[data-z]').forEach(b=>b.addEventListener('click',()=>fit(b.dataset.z)));
  fit('all');
};
(function(){const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+API_KEY+'&callback=initMap';s.async=true;s.defer=true;document.head.appendChild(s);})();
</script>
